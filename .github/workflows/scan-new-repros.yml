# Internal workflow
# Force refresh for GitHub Actions cache
name: "[Internal] Scan for New Reproductions"

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Pruva API URL'
        required: false
        default: 'https://api.pruva.dev/v1'
      run_tests:
        description: 'Run Codespace tests after creating branches'
        required: false
        default: 'true'
        type: boolean
      test_count:
        description: 'Number of latest branches to test'
        required: false
        default: '10'

jobs:
  scan-and-create-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.scan.outputs.created }}
      fixed: ${{ steps.scan.outputs.fixed }}
      new_repro_ids: ${{ steps.scan.outputs.new_repro_ids }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all reproductions and create branches
        id: scan
        env:
          API_URL: ${{ inputs.api_url }}
        run: |
          DEFAULT_SANDBOX_IMAGE=$(jq -r '.image // empty' .devcontainer/devcontainer.json)
          if ! echo "$DEFAULT_SANDBOX_IMAGE" | grep -Eq '^ghcr\.io/n3mes1s/pruva-sandbox@sha256:[0-9a-f]{64}$'; then
            echo "Invalid default sandbox image in .devcontainer/devcontainer.json: ${DEFAULT_SANDBOX_IMAGE:-empty}" >&2
            exit 1
          fi

          echo "Fetching reproductions from $API_URL..."
          echo "Default sandbox image: $DEFAULT_SANDBOX_IMAGE"
          REPRO_CACHE_DIR="/workspaces/pruva-sandbox/.pruva-repro-cache"
          DIND_FEATURE_KEY="ghcr.io/devcontainers/features/docker-in-docker:4"
          DIND_FEATURE_JSON=$(jq -Sc --arg key "$DIND_FEATURE_KEY" '.features[$key] // empty' .devcontainer/devcontainer.json)
          if [ -z "$DIND_FEATURE_JSON" ]; then
            echo "Missing canonical $DIND_FEATURE_KEY feature in .devcontainer/devcontainer.json" >&2
            exit 1
          fi

          write_devcontainer() {
            input_file="$1"
            output_file="$2"
            repro_id="$3"
            image="$4"
            jq \
              --arg repro_id "$repro_id" \
              --arg api_url "$API_URL" \
              --arg image "$image" \
              --arg cache_dir "$REPRO_CACHE_DIR" \
              --arg dind_key "$DIND_FEATURE_KEY" \
              --argjson dind_feature "$DIND_FEATURE_JSON" \
              '
                .features //= {}
                | .features |= with_entries(select((.key | startswith("ghcr.io/devcontainers/features/docker-outside-of-docker:") or startswith("ghcr.io/devcontainers/features/docker-in-docker:")) | not))
                | .features[$dind_key] = $dind_feature
                | .features["ghcr.io/devcontainers/features/sshd:1"].version = "latest"
                | .containerEnv.REPRO_ID = $repro_id
                | .containerEnv.PRUVA_API_URL = $api_url
                | .containerEnv.PRUVA_SANDBOX_IMAGE = $image
                | .containerEnv.PRUVA_REPRO_CACHE_DIR = $cache_dir
                | del(.containerEnv.DOCKER_API_VERSION)
                | .image = $image
              ' "$input_file" > "$output_file"
          }

          regression_in=$(mktemp)
          regression_out=$(mktemp)
          jq '.features["ghcr.io/devcontainers/features/docker-outside-of-docker:1"] = {"moby": true, "dockerDashComposeVersion": "latest"} | .features["ghcr.io/devcontainers/features/docker-in-docker:2"] = {"moby": false} | del(.features["ghcr.io/devcontainers/features/docker-in-docker:4"]) | .containerEnv.DOCKER_API_VERSION = "1.43"' .devcontainer/devcontainer.json > "$regression_in"
          write_devcontainer "$regression_in" "$regression_out" "REPRO-2026-00000" "$DEFAULT_SANDBOX_IMAGE"
          if jq -e '[((.features // {}) | keys[]? | select(startswith("ghcr.io/devcontainers/features/docker-outside-of-docker:")))] | length > 0' "$regression_out" >/dev/null; then
            echo "Regression failed: devcontainer rewrite preserved docker-outside-of-docker" >&2
            exit 1
          fi
          if ! jq -e --arg key "$DIND_FEATURE_KEY" --argjson feature "$DIND_FEATURE_JSON" '.features[$key] == $feature' "$regression_out" >/dev/null; then
            echo "Regression failed: devcontainer rewrite did not copy canonical Docker-in-Docker feature" >&2
            exit 1
          fi
          if jq -e --arg key "$DIND_FEATURE_KEY" '[((.features // {}) | keys[]? | select(startswith("ghcr.io/devcontainers/features/docker-in-docker:") and . != $key))] | length > 0' "$regression_out" >/dev/null; then
            echo "Regression failed: devcontainer rewrite preserved a non-canonical Docker-in-Docker feature" >&2
            exit 1
          fi
          if jq -e '.containerEnv | has("DOCKER_API_VERSION")' "$regression_out" >/dev/null; then
            echo "Regression failed: devcontainer rewrite preserved DOCKER_API_VERSION" >&2
            exit 1
          fi
          rm -f "$regression_in" "$regression_out"

          # Fetch all reproductions (paginated)
          REPROS=$(curl -sf "$API_URL/reproductions?status=published&limit=1000" | jq -r '.reproductions[].repro_id')

          if [ -z "$REPROS" ]; then
            echo "No reproductions found or API error"
            exit 1
          fi

          echo "Found reproductions:"
          echo "$REPROS"
          echo ""

          CREATED=0
          FIXED=0
          SKIPPED=0
          NEW_IDS=""

          for REPRO_ID in $REPROS; do
            BRANCH="repro/$REPRO_ID"
            EXPECTED_IMAGE="$DEFAULT_SANDBOX_IMAGE"

            # Check if branch exists and if it's properly configured
            if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
              # Branch exists - check if REPRO_ID and sandbox image are set correctly
              CURRENT_DEVCONTAINER=$(curl -sf "https://raw.githubusercontent.com/N3mes1s/pruva-sandbox/$BRANCH/.devcontainer/devcontainer.json" || echo "{}")
              CURRENT_ID=$(echo "$CURRENT_DEVCONTAINER" | jq -r '.containerEnv.REPRO_ID // empty')
              CURRENT_API_URL=$(echo "$CURRENT_DEVCONTAINER" | jq -r '.containerEnv.PRUVA_API_URL // empty')
              CURRENT_IMAGE=$(echo "$CURRENT_DEVCONTAINER" | jq -r '.image // empty')
              CURRENT_ENV_IMAGE=$(echo "$CURRENT_DEVCONTAINER" | jq -r '.containerEnv.PRUVA_SANDBOX_IMAGE // empty')
              CURRENT_REPRO_CACHE_DIR=$(echo "$CURRENT_DEVCONTAINER" | jq -r '.containerEnv.PRUVA_REPRO_CACHE_DIR // empty')
              CURRENT_HAS_DOCKER_API_VERSION=$(echo "$CURRENT_DEVCONTAINER" | jq -r '(.containerEnv // {}) | has("DOCKER_API_VERSION")')
              CURRENT_SSHD_VERSION=$(echo "$CURRENT_DEVCONTAINER" | jq -r '.features["ghcr.io/devcontainers/features/sshd:1"].version // empty')
              CURRENT_DOCKER_OUTSIDE_KEY=$(echo "$CURRENT_DEVCONTAINER" | jq -r '((.features // {}) | keys[]? | select(startswith("ghcr.io/devcontainers/features/docker-outside-of-docker:"))) // empty' | head -n 1)
              CURRENT_DIND_FEATURE=$(echo "$CURRENT_DEVCONTAINER" | jq -Sc --arg key "$DIND_FEATURE_KEY" '.features[$key] // empty')

              if [ "$CURRENT_ID" = "$REPRO_ID" ] && [ "$CURRENT_API_URL" = "$API_URL" ] && [ "$CURRENT_SSHD_VERSION" = "latest" ] && [ -z "$CURRENT_DOCKER_OUTSIDE_KEY" ] && [ "$CURRENT_DIND_FEATURE" = "$DIND_FEATURE_JSON" ] && [ "$CURRENT_IMAGE" = "$EXPECTED_IMAGE" ] && [ "$CURRENT_ENV_IMAGE" = "$EXPECTED_IMAGE" ] && [ "$CURRENT_REPRO_CACHE_DIR" = "$REPRO_CACHE_DIR" ] && [ "$CURRENT_HAS_DOCKER_API_VERSION" = "false" ]; then
                echo "SKIP: $BRANCH already configured correctly"
                SKIPPED=$((SKIPPED + 1))
                continue
              fi

              echo "FIX: $BRANCH (current id: ${CURRENT_ID:-empty}, expected id: $REPRO_ID, current api: ${CURRENT_API_URL:-empty}, expected api: $API_URL, current image: ${CURRENT_IMAGE:-empty}, current env image: ${CURRENT_ENV_IMAGE:-empty}, expected image: ${EXPECTED_IMAGE:-none}, cache: ${CURRENT_REPRO_CACHE_DIR:-missing}, docker api pinned: ${CURRENT_HAS_DOCKER_API_VERSION:-unknown}, sshd: ${CURRENT_SSHD_VERSION:-missing}, docker outside: ${CURRENT_DOCKER_OUTSIDE_KEY:-absent}, dind feature: ${CURRENT_DIND_FEATURE:-missing})"

              # Checkout existing branch and fix it
              git fetch origin "$BRANCH:$BRANCH"
              git checkout "$BRANCH"

              # Update devcontainer.json to set correct REPRO_ID and public pinned image.
              tmp_devcontainer=$(mktemp)
              write_devcontainer .devcontainer/devcontainer.json "$tmp_devcontainer" "$REPRO_ID" "$EXPECTED_IMAGE"
              mv "$tmp_devcontainer" .devcontainer/devcontainer.json

              # Commit and force-push fix
              git add .devcontainer/devcontainer.json
              git commit -m "fix: configure Codespace for $REPRO_ID" \
                -m "Co-Authored-By: GitHub Actions <github-actions[bot]@users.noreply.github.com>"
              git push --force-with-lease origin "$BRANCH"

              FIXED=$((FIXED + 1))
              NEW_IDS="$NEW_IDS $REPRO_ID"

              # Return to main
              git checkout main
              continue
            fi

            echo "CREATE: $BRANCH"

            # Create branch from main
            git checkout -b "$BRANCH" origin/main

            # Update devcontainer.json to set REPRO_ID and public pinned image.
            tmp_devcontainer=$(mktemp)
            write_devcontainer .devcontainer/devcontainer.json "$tmp_devcontainer" "$REPRO_ID" "$EXPECTED_IMAGE"
            mv "$tmp_devcontainer" .devcontainer/devcontainer.json

            # Commit changes
            git add .devcontainer/devcontainer.json
            git commit -m "chore: configure Codespace for $REPRO_ID" \
              -m "Co-Authored-By: GitHub Actions <github-actions[bot]@users.noreply.github.com>"

            # Push branch
            git push origin "$BRANCH"

            CREATED=$((CREATED + 1))
            NEW_IDS="$NEW_IDS $REPRO_ID"

            # Return to main for next iteration
            git checkout main
          done

          echo ""
          echo "=========================================="
          echo "Summary:"
          echo "  Created: $CREATED"
          echo "  Fixed: $FIXED"
          echo "  Skipped: $SKIPPED"
          echo "=========================================="

          if [ $CREATED -eq 0 ] && [ $FIXED -eq 0 ]; then
            echo "No changes needed - all branches are correctly configured"
          fi

          echo "created=$CREATED" >> "$GITHUB_OUTPUT"
          echo "fixed=$FIXED" >> "$GITHUB_OUTPUT"
          echo "new_repro_ids=$(echo $NEW_IDS | xargs)" >> "$GITHUB_OUTPUT"

  # Run Codespace tests on the latest branches after scanning
  test-codespaces:
    needs: scan-and-create-branches
    if: ${{ inputs.run_tests }}
    uses: ./.github/workflows/test-codespaces.yml
    with:
      api_url: ${{ inputs.api_url }}
      latest_count: ${{ inputs.test_count || '10' }}
    permissions:
      contents: read
      packages: read
      issues: write
